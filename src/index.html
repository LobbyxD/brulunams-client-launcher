<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrulunaMS Launcher</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="launcher-frame">
    <header class="titlebar">
      <div class="brand">
        <img src="../assets/fit/icon.png" alt="BrulunaMS" onerror="this.style.display='none'">
      </div>
      <nav class="window-controls" aria-label="Window controls">
        <button id="minimizeButton" type="button" aria-label="Minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button id="closeButton" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </nav>
    </header>

    <section class="launcher-body">
      <aside class="sidebar">
        <nav class="nav-list">
          <button class="nav-item nav-home active" type="button"><span class="nav-icon">⌂</span><span>HOME</span><i></i></button>
          <button class="nav-item nav-news" type="button"><span class="nav-icon">▤</span><span>NEWS</span></button>
          <button class="nav-item nav-events" type="button"><span class="nav-icon">✦</span><span>EVENTS</span></button>
          <button class="nav-item nav-rankings" type="button"><span class="nav-icon">♛</span><span>RANKINGS</span></button>
          <button class="nav-item nav-donate" type="button"><span class="nav-icon">♥</span><span>DONATE</span></button>
          <button class="nav-item nav-discord" type="button"><span class="nav-icon">☊</span><span>DISCORD</span></button>
        </nav>

        <section class="status-card">
          <div class="server-line">
            <span class="status-dot"></span>
            <strong id="serverPill">OFFLINE</strong>
          </div>
          <p id="serverText">Waiting for patch server.</p>
          <span class="leaf-mark">✦</span>
        </section>

        <div class="side-mascot" aria-hidden="true">
          <img src="../assets/fit/mascot_mushroom.png" alt="" onerror="this.style.display='none'">
        </div>
      </aside>

      <section class="main-stage">
        <section class="hero-art">
          <img class="hero-image" src="../assets/launcher_background_main.png" alt="" onerror="this.style.display='none'">
          <div class="sky-fallback" aria-hidden="true">
            <span class="moon"></span>
            <span class="island island-one"></span>
            <span class="island island-two"></span>
            <span class="castle"></span>
          </div>
          <img class="hero-logo" src="../assets/fit/logo.png" alt="BrulunaMS" onerror="this.style.display='none'">
          <div class="hero-copy">
            <div class="crest">✦</div>
            <h1>BrulunaMS</h1>
            <p>JOIN THE ADVENTURE. WRITE YOUR LEGEND.</p>
          </div>
          <img class="character-art" src="../assets/fit/characters_hero_group.png" alt="" onerror="this.style.display='none'">
        </section>

        <div class="update-separator" aria-hidden="true">
          <div id="separatorProgressFill"></div>
          <span id="separatorProgressSpark" hidden></span>
        </div>

        <footer class="bottom-panel">
          <section class="info-card patch-card">
            <div class="card-title"><span>✦</span><strong>CLIENT STATUS</strong></div>
            <p id="statusLabel">Client is ready</p>
            <small id="versionLabel">Checking client version...</small>
            <button id="repairButton" class="link-row" type="button">
              <span id="progressLabel">Click to verify and repair files</span>
              <b>›</b>
            </button>
          </section>

          <section class="info-card event-card">
            <div class="card-title"><span>✦</span><strong>FEATURED EVENT</strong></div>
            <h2>Lunar Festival</h2>
            <p>Double EXP and exclusive rewards.</p>
            <img src="../assets/fit/mascot_mushroom.png" alt="" onerror="this.style.display='none'">
          </section>

          <section class="play-wrap">
            <button id="playButton" type="button"><span>PLAY</span></button>
          </section>

          <button id="settingsButton" class="settings-button" type="button" aria-label="Settings">
            <span>⚙</span>
            <b>SETTINGS</b>
          </button>
        </footer>
      </section>
    </section>

    <p id="errorBox" class="error" hidden></p>
    <section id="settingsDialog" class="settings-dialog" hidden>
      <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="settingsCloseButton" type="button" aria-label="Close settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="settings-grid">
          <label>
            Display mode
            <select id="displayModeInput">
              <option value="windowed">Windowed</option>
              <option value="fullscreen">Fullscreen</option>
            </select>
          </label>
          <label>
            Resolution
            <select id="resolutionInput">
              <option value="800x600">800 x 600</option>
              <option value="1024x768">1024 x 768</option>
              <option value="1280x720">1280 x 720</option>
              <option value="1366x768">1366 x 768</option>
              <option value="1600x900">1600 x 900</option>
              <option value="1920x1080">1920 x 1080</option>
            </select>
          </label>
          <label class="toggle-row">
            <input id="borderlessInput" type="checkbox">
            <span>Borderless window</span>
          </label>
          <label class="toggle-row">
            <input id="scaleToScreenInput" type="checkbox">
            <span>Scale to screen</span>
          </label>
          <label class="toggle-row">
            <input id="mobOverlayInput" type="checkbox">
            <span>Show mob levels</span>
          </label>
          <label class="toggle-row">
            <input id="textShortcutsInput" type="checkbox">
            <span>Text input shortcuts</span>
          </label>
          <label class="toggle-row">
            <input id="spaceNpcInput" type="checkbox">
            <span>Space advances NPC dialogs</span>
          </label>
          <label class="toggle-row">
            <input id="autoFlashJumpInput" type="checkbox">
            <span>Auto flash jump helper</span>
          </label>
        </div>
        <p id="settingsPath"></p>
        <div class="settings-actions">
          <button id="settingsCancelButton" type="button">Cancel</button>
          <button id="settingsSaveButton" type="button">Save</button>
        </div>
      </div>
    </section>
    <span id="clientDir" hidden></span>
    <span id="patchUrl" hidden></span>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
